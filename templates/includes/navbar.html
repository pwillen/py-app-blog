    <a class="navbar-brand" href="{% url 'home:index' %}">
        <svg
            class="brand-icon"
            viewBox="0 0 40 40"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <rect x="2" y="2" width="36" height="36" rx="9"
                  fill="none" stroke="currentColor" stroke-width="2"/>

            <path d="M9 20h4l3-8 5 16 4-12 3 4h3"
                  fill="none" stroke=var(--yellow-brand)
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
        <span class="brand-purple">Purple</span>
        <span class="brand-static">Static</span>

    <nav class="navbar-links" aria-label="Primary">
        <a class="navbar-link {% if request.resolver_match.app_name == 'home' %}active{% endif %}" href="{% url 'home:index' %}">Home</a>

        <span class="navbar-link-disabled">Blog</span>
        <a class="navbar-link {% if request.resolver_match.app_name == 'about' %}active{% endif %}" href="{% url 'about:index' %}">About</a>
    </nav>
